name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Letöltjük a hivatalos Godot 4.7-es verziót közvetlenül a Linuxos szerverre
      - name: Download Godot
        run: |
          wget https://tuxfamily.org
          unzip Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-headless

      # 2. Letöltjük a Webes sablonokat, amik a HTML5-höz kellenek
      - name: Download Export Templates
        run: |
          wget https://tuxfamily.org
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip Godot_v4.7-stable_export_templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/4.7.stable/

      # 3. Létrehozzuk a builds mappát a főkönyvtárban
      - name: Create Build Directory
        run: mkdir -p builds/web

      # 4. Közvetlenül parancssorból kiadjuk a Godot-nak az export parancsot
      - name: Run Godot Export
        run: |
          ./godot-headless --headless --path . --export-release "Web (Runnable)" builds/web/index.html
      # 5. Feltöltjük a kész fájlokat GitHubra
      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error