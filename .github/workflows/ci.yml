name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  export_game:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      # 1. Kód letöltése
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. A hivatalos Godot közösségi export action meghívása
      # Ez magától kezeli a 4.3-as verziót, a gyorsítótárat és a sablonokat is!
      - name: Godot Android/Web/Windows Export
        uses: simonbrito/godot-export@v1
        with:
          godot-version: '4.3'
          # Megadjuk a pontos preseted nevét
          export-preset: 'Web (Runnable)'
          # A te kisbetűs builds mappád a gyökérben
          export-path: 'builds/web/index.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Kész fájlok feltöltése
      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error