name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Letöltjük a Godot 4.3 stabilt
      - name: Download Godot
        run: |
          wget https://tuxfamily.org
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot-headless

      # 2. Helyes mappába másoljuk a sablonokat (EZ JAVÍTJA KI AZ EXIT CODE 9-ET)
      - name: Download Export Templates
        run: |
          wget https://tuxfamily.org
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp
          # A tpz fájlon belül egy "templates" mappa van, annak a tartalmát mozgatjuk át:
          cp -r /tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      # 3. Létrehozzuk a builds mappát
      - name: Create Build Directory
        run: mkdir -p builds/web

      # 4. Bemelegítjük a projekt gyorsítótárát headless módban
      - name: Import Assets
        run: |
          ./godot-headless --headless --path . --editor --quit || true

      # 5. Futtatjuk a tiszta exportálást
      - name: Run Godot Export
        run: |
          ./godot-headless --headless --path . --export-release "Web (Runnable)" builds/web/index.html

      # 6. Feltöltjük a kész ZIP-et GitHubra
      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error