name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Godot Export (Web)
        uses: firebelley/godot-export@v5.3.0
        with:
          # A Godot 4-es verziód (pl. 4.3)
          godot_version: '4.7.2'
          # A Godot Export ablakában megadott pontos név
          export_preset: 'Web'
          # Ide menti a szerver a buildet ideiglenesen
          export_output_directory: 'builds/web'

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/