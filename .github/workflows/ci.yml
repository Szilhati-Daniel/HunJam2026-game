name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Letöltjük a sziklaszilárd Godot 4.3 stabil verziót
      - name: Download Godot
        run: |
          wget https://tuxfamily.org
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot-headless

      # 2. Letöltjük a hozzá tartozó hivatalos Webes sablonokat
      - name: Download Export Templates
        run: |
          wget https://tuxfamily.org
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      # 3. Biztosítjuk a builds/web mappa létezését
      - name: Create Build Directory
        run: mkdir -p builds/web

      # 4. Kényszerítjük a parancssoros exportálást a te preseted nevével
      - name: Run Godot Export
        run: |
          ./godot-headless --headless --path . --export-release "Web (Runnable)" builds/web/index.html

      # 5. Feltöltjük a kész ZIP-et GitHubra
      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error