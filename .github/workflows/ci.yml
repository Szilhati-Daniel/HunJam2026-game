
name: "Godot Web CI Build"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest

    steps:
      # 1. Forráskód letöltése
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Godot 4.3 letöltése
      - name: Download Godot
        run: |
          wget -O godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mv Godot_v4.3-stable_linux.x86_64 godot-headless

      # 3. Export template-ek letöltése
      - name: Download Export Templates
        run: |
          wget -O templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. \
            ~/.local/share/godot/export_templates/4.3.stable/

      # 4. Presetek ellenőrzése
      - name: Check Export Preset
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg not found!"
            exit 1
          fi

          grep -n 'name=' export_presets.cfg

      # 5. Projekt importálása
      - name: Import Assets
        run: |
          ./godot-headless --headless --path . --editor --quit

      # 6. Web export
      - name: Run Godot Export
        run: |
          mkdir -p builds/web

          ./godot-headless \
            --headless \
            --path . \
            --export-release "Web" \
            builds/web/index.html

      # 7. Build ellenőrzése
      - name: Verify Build
        run: |
          if [ ! -f builds/web/index.html ]; then
            echo "ERROR: Web export failed!"
            exit 1
          fi

          ls -lah builds/web/

      # 8. Artifact feltöltése
      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error
