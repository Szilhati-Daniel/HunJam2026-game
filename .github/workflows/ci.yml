name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Kényszerítjük a builds/web mappa létrejöttét, hogy a Godot biztosan megtalálja
      - name: Create Build Directory
        run: mkdir -p builds/web

      - name: Godot Export (Web)
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://tuxfamily.org
          godot_export_templates_download_url: https://tuxfamily.org
          relative_project_path: ./
          archive_output: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A biztonság kedvéért kilistázzuk, mit gyártott a Godot (látható lesz a GitHub naplóban)
      - name: List Output Files
        run: ls -la builds/web

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error