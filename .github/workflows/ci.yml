name: "Godot Web CI Build"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest

    steps:
      # 1. Projekt letöltése
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Godot 4.3 letöltése
      - name: Download Godot
        run: |
          wget -O godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mv Godot_v4.3-stable_linux.x86_64 godot-headless

      # 3. Export template-ek letöltése
      - name: Download Export Templates
        run: |
          wget -O templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p /tmp/godot-templates

          unzip -q templates.tpz -d /tmp/godot-templates

          cp -a /tmp/godot-templates/templates/. \
            ~/.local/share/godot/export_templates/4.3.stable/

      # 4. Export preset javítása és ellenőrzése
      - name: Fix Export Preset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("export_presets.cfg")

          if not path.exists():
              raise SystemExit("ERROR: export_presets.cfg not found!")

          content = path.read_text()

          if '[preset.0]' not in content:
              raise SystemExit("ERROR: preset.0 not found!")

          if 'runnable=true' not in content:
              content = content.replace(
                  'platform="Web"',
                  'platform="Web"\nrunnable=true',
                  1
              )

          content = content.replace(
              'export_path="../builds/web/index.html"',
              'export_path="builds/web/index.html"'
          )

          path.write_text(content)

          print("Export preset:")
          print(content)
          PY

      # 5. Cache és könyvtárak előkészítése
      - name: Prepare Environment
        run: |
          rm -rf .godot

          mkdir -p .godot/editor
          mkdir -p .godot/exported
          mkdir -p builds/web

          chmod -R u+rwX .

      # 6. Projekt importálása
      - name: Import Assets
        run: |
          ./godot-headless \
            --headless \
            --editor \
            --path . \
            --verbose \
            --quit

      # 7. Web export
      - name: Run Godot Export
        run: |
          ./godot-headless \
            --headless \
            --path . \
            --verbose \
            --export-release "Web" \
            builds/web/index.html

      # 8. Build ellenőrzése
      - name: Verify Build
        run: |
          echo "Checking Web build..."

          test -f builds/web/index.html || {
            echo "ERROR: index.html missing!"
            exit 1
          }

          echo "Build files:"
          find builds/web -maxdepth 2 -type f -print

      # 9. Build feltöltése
      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: builds/web/
          if-no-files-found: error