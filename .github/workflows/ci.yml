name: "Godot Web CI Build"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Godot Export (Web)
        uses: firebelley/godot-export@v8.0.0
        with:
          # A szerver letölti a hivatalos linuxos Godot verziót (a 4.7-es ág stabil kiadását használjuk)
          godot_executable_download_url: https://tuxfamily.org
          godot_export_templates_download_url: https://tuxfamily.org
          # A projekt a repó gyökerében van
          relative_project_path: ./
          archive_output: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          # Mivel az action a gyári export_presets.cfg-ből olvassa ki a célt, az ottani mappát töltjük fel
          path: builds/web/
